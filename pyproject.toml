[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phi3-renormalization"
version = "0.1.0"
description = "Phi3 renormalization"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Harihi86"}]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2"]

[project.scripts]
phi3-demo = "phi3_public.demo:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
exclude = ["legacy"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
